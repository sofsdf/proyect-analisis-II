{% extends "base.html" %}

{% block title %}Nueva Convocatoria{% endblock %}

{% block content %}
<div class="card shadow-sm p-4">
    <h2 class="mb-4">Nueva Convocatoria</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label fw-bold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Guardar Convocatoria</button>
        <a href="{% url 'convocatorias:admin_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
